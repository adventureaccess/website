backend:
  name: github
  repo: adventureaccess/website
  branch: main
  # GitHub OAuth relay (netlify/functions/auth-github*). base_url is this site;
  # auth_endpoint is where the CMS opens the login popup.
  base_url: https://www.adventure-access.com
  auth_endpoint: /auth/github

# Uncomment the line below to enable editorial workflow
# (changes go to a draft branch and require review before publishing)
# publish_mode: editorial_workflow

site_url: https://www.adventure-access.com

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: blog
    label: Journal Posts
    label_singular: Journal Post
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    preview_path: "blog/{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    fields:
      - name: title
        label: Title
        widget: string

      - name: date
        label: Publish Date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false

      - name: excerpt
        label: Excerpt / Meta Description
        widget: text
        hint: "Shown in blog cards and as the SEO meta description. Keep under 155 characters."

      - name: featured_image
        label: Featured Image
        widget: image
        required: false
        hint: "Hero image for the post. Shown at the top of the article and in blog cards."

      - name: destination
        label: Related Destination
        widget: select
        required: false
        options:
          - { label: "Ladakh & Zanskar", value: ladakh }
          - { label: "Nepal", value: nepal }
          - { label: "Bhutan", value: bhutan }
          - { label: "Yunnan & Lijiang", value: yunnan }
        hint: "Links this post to a destination page — a 'Explore [Destination]' CTA block appears at the bottom of the article."

      - name: gallery
        label: Photo Gallery
        widget: list
        required: false
        hint: "Photos shown in a grid at the bottom of the post. Click + to add images, drag to reorder."
        field:
          name: image
          label: Photo
          widget: image

      - name: body
        label: Body
        widget: markdown

  - name: testimonials
    label: Testimonials
    files:
      - name: testimonials
        label: All Testimonials
        file: src/data/testimonials.json
        fields:
          - name: items
            label: Testimonials
            label_singular: Testimonial
            widget: list
            summary: "{{fields.name}} — {{fields.destination}}"
            fields:
              - name: quote
                label: Quote
                widget: text
                hint: "The full review text. Use a shorter excerpt for better display — 1–3 sentences ideal."

              - name: name
                label: Reviewer Name
                widget: string

              - name: location
                label: Reviewer Location
                widget: string
                hint: "e.g. United States, Asheville, North Carolina"

              - name: destination
                label: Destination
                widget: string
                hint: "e.g. Ladakh & Zanskar, India"

              - name: rating
                label: Star Rating
                widget: number
                default: 5
                min: 1
                max: 5
                value_type: int

              - name: source
                label: Review Source
                widget: select
                options:
                  - { label: Trustpilot, value: trustpilot }
                  - { label: Direct / Email, value: direct }
                  - { label: Google, value: google }
                  - { label: TripAdvisor, value: tripadvisor }
                default: trustpilot

              - name: featured
                label: Show in card grid on homepage
                widget: boolean
                default: false
                hint: "Turn on to display this testimonial in the 3-card section. Aim for 3 featured at a time."

              - name: heroQuote
                label: Use as full-bleed hero quote
                widget: boolean
                default: false
                hint: "Only one testimonial should have this on at a time. This is the large cinematic quote on the homepage."
